# Referral outreach on LinkedIn — after an application, message people at that company.
enabled: true
ask_after_apply: true        # after each successful application: "Message people at <company>?"
daily_cap: 200                # people per day. LinkedIn also caps invites (~100-200 / week) — stay well under
per_company: 10              # people per company (mix: 1 eng leader + 1 recruiter/HR + 1 more)
prefer: connect              # connect = invite with a note (free) | message = InMail/message first (uses Premium credits)
mode: send                   # send = tool clicks Send after your OK | draft = tool fills, YOU click Send
search_keywords:             # searched on the company's People tab, in this order
  - engineering manager
  - vp engineering
  - head of engineering
  - director engineering
  - talent acquisition
  - technical recruiter
  - hr

my_title: "Software Developer"
my_company: "Netcore Cloud"

# Placeholders: {first_name} {role} {company} {skills} (4-5 job skills you have)
#               {job_ref} = " (Job ID: 123)" when you give a job ID, else empty
#               {skills_short} (3) {my_title} {my_company}
message: >-
  Hi {first_name}, I'm a {my_title} at {my_company} with hands-on experience in {skills}.
  I recently applied for the {role} role{job_ref} at {company} and my background lines up well with what the
  team needs. Would you be open to referring me or pointing me to the right person? Happy to share my
  resume. Thank you!
inmail_subject: "Referral request: {role}{job_ref} at {company}"
# Connection-request note: LinkedIn limit is 300 characters. {skills_short} gets as many of the
# job's skills (that you have) as fit.
note: >-
  Hi {first_name}, I'm a {my_title} at {my_company} working with {skills_short}. I applied for the
  {role} role{job_ref} at {company} and my experience matches the JD closely. Would really appreciate
  connecting or a referral. Thank you!

# Used when you contact a company WITHOUT a specific application (outreach --company X)
note_general: >-
  Hi {first_name}, I'm a {my_title} at {my_company} with 2 years in {skills_short}. I'm exploring
  {role} opportunities at {company} and would love to connect. Would you be open to a referral or
  pointing me to the right team? Thank you!
message_general: >-
  Hi {first_name}, I'm a {my_title} at {my_company} with 2 years of hands-on experience in {skills}.
  I'm exploring {role} opportunities at {company} and would love to connect. Would you be open to a
  referral or pointing me to the right team? Happy to share my resume. Thank you!
default_role: "Software Engineer / Backend"

naukri:
  queries:
    - keywords: "python developer"     # TODO: your job title
      locations: ["pune", "bangalore"] # TODO: your cities
      experience: 3                    # TODO: your years of experience
  job_age_days: 7        # only jobs posted in the last N days (1, 3, 7, 15, 30)
  pages_per_query: 2     # ~20 jobs per page

limits:
  daily_cap: 25          # max applications per site per day
  min_match_score: 60    # 0-100; jobs below this are skipped

delays:                  # seconds, random within range
  action: [0.6, 1.8]
  between_jobs: [25, 70]

review:
  confirm_before_apply: true   # show job + score, wait for your OK before clicking Apply
  auto_accept_known: true      # answers from profile.yaml / saved cache are filled without asking
  auto_accept_confidence: 0.85

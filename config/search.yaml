naukri:
  queries:
    - keywords: "java full stack developer"
      locations: ["mumbai", "bangalore", "pune"]
      experience: 2
    - keywords: "java spring boot developer"
      locations: ["mumbai", "bangalore", "pune"]
      experience: 2
    - keywords: "golang developer"
      locations: ["mumbai", "bangalore", "pune"]
      experience: 2
  job_age_days: 7        # only jobs posted in the last N days (1, 3, 7, 15, 30)
  pages_per_query: 2     # ~20 jobs per page

linkedin:
  # Easiest: build the search in LinkedIn (filters: Past 24 hours, Easy Apply, ...) and paste the URL here.
  search_urls:
    - "https://www.linkedin.com/jobs/search-results/?keywords=java%20full%20stack%20developer&f_TPR=r86400&f_AL=true"
    - "https://www.linkedin.com/jobs/search-results/?keywords=java%20spring%20boot%20developer&f_TPR=r86400&f_AL=true"
    - "https://www.linkedin.com/jobs/search-results/?keywords=golang%20developer&f_TPR=r86400&f_AL=true"
  # Or generate URLs from keywords (uses date_posted / easy_apply_only / experience_levels below):
  queries: []
  #  - keywords: "java developer"
  #    locations: [""]
  experience_levels: []       # e.g. [2, 3]  1 internship, 2 entry, 3 associate, 4 mid-senior
  date_posted: day            # day = past 24 hours | week | month
  easy_apply_only: true       # true = Easy Apply only; false = also external "Apply on company website"
  pages_per_query: 3          # 25 jobs per page

external:
  enabled: true          # apply on company sites (Greenhouse/Lever auto-filled, others assisted)

limits:
  daily_cap: 25          # max applications per site per day
  daily_cap_by_site:
    linkedin: 15         # LinkedIn flags bursts — keep lower
  min_match_score: 60    # 0-100; jobs below this are skipped

delays:                  # seconds, random within range
  action: [0.6, 1.8]
  between_jobs: [2, 5]

review:
  confirm_before_apply: true   # show job + score, wait for your OK before clicking Apply
  auto_accept_known: true      # answers from profile.yaml / saved cache are filled without asking
  auto_accept_confidence: 0.85

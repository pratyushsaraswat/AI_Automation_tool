naukri:
  # Easiest: set filters on naukri.com and paste the URL here (used instead of queries below).
  search_urls: []
  #  - "https://www.naukri.com/golang-developer-java-developer-backend-development-jobs?k=golang%20developer%2C%20java%20developer%2C%20backend%20development&experience=2&functionAreaIdGid=3&functionAreaIdGid=5"
  queries:                 # one search per line. Combining them makes Naukri return unrelated roles.
    - keywords: "golang developer"
      locations: [""]      # "" = anywhere
      experience: 2
    - keywords: "java developer"
    - keywords: "python developer"
  departments: []          # leave empty. A department id on the search URL replaces the keyword with other roles.
  work_mode: []            # wfhType: 0 = office, 2 = remote, 3 = hybrid; [] = all
  job_age_days: 7          # skip a card older than this when it shows a posted date. Not sent as jobAge.
  min_ctc_lpa: 10          # your package is 9 LPA — skip a card whose posted package is below this. Not sent as ctcFilter.
  recommended: true        # Jobs menu → Recommended Jobs, before the keyword searches
  recommended_pages: 2
  pages_per_query: 3       # 20 jobs per page
  sort_by_date: true

linkedin:
  # Easiest: build the search in LinkedIn (filters: Past 24 hours, Easy Apply, ...) and paste the URL here.
  search_urls:
    # Java Full Stack · past 24h · salary filter (your link). Entry-level filter is added from experience_levels.
    - "https://www.linkedin.com/jobs/search-results/?keywords=java%20full%20stack%20developer&f_TPR=r86400&f_SAL=f_SA_id_227001%3A276001"
    - "https://www.linkedin.com/jobs/search-results/?keywords=java%20developer&f_TPR=r86400"
    - "https://www.linkedin.com/jobs/search-results/?keywords=golang%20developer&f_TPR=r86400"
    - "https://www.linkedin.com/jobs/search-results/?keywords=backend%20developer&f_TPR=r86400"
  # Or generate URLs from keywords (uses date_posted / easy_apply_only / experience_levels below):
  queries: []
  #  - keywords: "java developer"
  #    locations: [""]
  experience_levels: [2, 3]   # 2 = Entry level, 3 = Associate (fresher–2 yrs). 1 internship, 4 mid-senior
  date_posted: day            # day = past 24 hours | week | month
  easy_apply_only: false      # false = Easy Apply AND company-site jobs (max applications) | true = Easy Apply only
  pages_per_query: 3          # 25 jobs per page

mycareernet:
  search_urls: []          # or paste https://mycareernet.co/mycareernet/jobs/listings/<x>-jobs?page=1
  queries:
    - keywords: "java developer"
      locations: [""]      # "" = anywhere; e.g. ["bengaluru", "pune"]
      experience: 2        # keeps jobs whose "Exp: a - b yrs" range includes this
    - keywords: "golang developer"
    - keywords: "backend developer"
    - keywords: "software engineer"
  pages_per_query: 8       # MyCareernet lists mostly senior roles — scan more pages to find 2-yr ones

teamlease:
  search_urls: []          # or paste e.g. https://www.teamleasedigital.com/software-development-jobs
  queries:
    - keywords: "java developer"
      locations: [""]
      experience: 2
    - keywords: "software developer"
    - keywords: "software development"
    - keywords: "full stack developer"
  scrolls: 6               # results load as you scroll

randstad:
  # Randstad's keyword search finds little — browse the IT categories (Enter at the first question uses these)
  search_urls:
    - "https://www.randstad.in/jobs/s-it/s2-software-and-application-developers/"
    - "https://www.randstad.in/jobs/s-it/"
  queries: []
  experience: 2            # skip jobs asking more than experience + 2 years ("experience 8" on the job page)
  pages_per_query: 5       # 30 jobs per page

filters:
  strict_stack: false      # true = also drop a card before opening it, when the card tags miss your stack
  preferred_stacks:        # a generic search ("software developer") must mention one of these
    - python
    - golang
    - java
  exclude_titles: []       # extra title words to skip, e.g. ["php", "dotnet"]
  exclude_companies:       # never open or apply; matched inside "Infosys BPM", "Accenture Solutions"
    - infosys
    - accenture

external:
  enabled: true          # apply on company sites (Greenhouse/Lever auto-filled, others assisted)
  company_sites: ask     # --auto + generic/Workday: ask = prompt at run start / per job | now = open immediately | queue = end of run

limits:
  daily_cap: 250          # max applications per site per day
  daily_cap_by_site:
    linkedin: 15         # LinkedIn flags bursts — keep lower
  min_match_score: 60    # 0-100; jobs below this are skipped
  ask_low_match_software: true  # below min score -> ask you 'apply anyway? y' (also in --auto); false = skip

delays:                  # seconds, random within range
  action: [0.6, 1.8]
  between_jobs: [2, 5]

review:
  confirm_before_apply: true   # show job + score, wait for your OK before clicking Apply
  auto_accept_known: true      # answers from profile.yaml / saved cache are filled without asking
  auto_accept_confidence: 0.85
